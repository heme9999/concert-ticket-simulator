<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="Diagram comparing Starlight Civic Arena three price tiers: Floor, Lower Bowl, and Upper Terrace">
  <rect width="880" height="420" rx="20" fill="#0b0e17"/>
  <text x="440" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#f8fafc">Starlight Civic Arena — Fictional 3-Tier Map &amp; Price Structure</text>

  <!-- Stage -->
  <rect x="290" y="58" width="300" height="38" rx="10" fill="#4f46e5"/>
  <text x="440" y="82" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="900" fill="#ffffff">CONCERT STAGE</text>

  <!-- Tier 1: Floor -->
  <rect x="130" y="116" width="295" height="80" rx="14" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
  <text x="277" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="800" fill="#f0f9ff">FL-A Floor Center West · $195</text>
  <text x="277" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#bae6fd">Tier 1 · Flat floor · Closest crowd energy</text>

  <rect x="455" y="116" width="295" height="80" rx="14" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
  <text x="602" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="800" fill="#f0f9ff">FL-B Floor Center East · $185</text>
  <text x="602" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#bae6fd">Tier 1 · Head-on stage view · Flat sightline</text>

  <!-- Center Aisle -->
  <line x1="440" y1="112" x2="440" y2="392" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="404" y="198" width="72" height="22" rx="6" fill="#451a03" stroke="#f59e0b"/>
  <text x="440" y="213" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#fde68a">AISLE</text>

  <!-- Tier 2: Lower Bowl -->
  <rect x="95" y="226" width="320" height="80" rx="14" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <text x="255" y="258" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="800" fill="#ecfdf5">LOW-101 Lower Bowl West · $135</text>
  <text x="255" y="282" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#a7f3d0">Tier 2 · Raked rows · Balanced view &amp; price</text>

  <rect x="465" y="226" width="320" height="80" rx="14" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <text x="625" y="258" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="800" fill="#ecfdf5">LOW-102 Lower Bowl East · $125</text>
  <text x="625" y="282" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#a7f3d0">Tier 2 · Common backup target under $140 cap</text>

  <!-- Tier 3: Upper Terrace -->
  <rect x="130" y="324" width="620" height="72" rx="14" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
  <text x="440" y="355" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="800" fill="#eef2ff">UP-201 Upper Terrace Center · $75</text>
  <text x="440" y="378" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#c7d2fe">Tier 3 · Full production sightline · Most affordable virtual price</text>
</svg>
